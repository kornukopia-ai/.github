name: Org Activity Metrics
on:
  schedule:
    - cron: "0 0 * * 5"  # 금요일 09:00 KST
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: github-svg-updates
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: StaticRunner
    permissions:
      contents: write
    steps:
      # 조직 전체 읽기 PAT를 넘기는 서드파티 액션이므로 커밋 SHA로 고정한다.
      # 업그레이드는 SHA를 교체해 명시적으로 한다.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.READREPOS }}
          
          user: kornukopia-ai
          template: classic
          base: header, repositories, metadata
          
          # 깊은 분석
          base_indepth: yes
          
          repositories_affiliations: owner, collaborator, organization_member
          repositories_batch: 50
          
          config_timezone: Asia/Seoul
          retries: 3
          retries_delay: 300
